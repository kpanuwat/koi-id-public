<!doctype html><meta charset="utf-8"><title>bench</title><pre id="o"></pre>
<script type="module">
import * as ort from '../vendor/ort.webgpu.min.mjs';
ort.env.wasm.wasmPaths = new URL('../vendor/', location.href).href;
const q = new URLSearchParams(location.search);
if (q.has('verbose')) { ort.env.logLevel = 'verbose'; ort.env.debug = true; }
const log = s => (document.getElementById('o').textContent += s + '\n');
const a = await navigator.gpu?.requestAdapter(); log('adapter ' + (a?.info?.vendor || 'none') + ' f16 ' + a?.features?.has('shader-f16'));
const models = (q.get('m') || '../models/koi_det.onnx:1,3,432,432|../models/embed.onnx:6,3,112,224').split('|').map(s => { const [m, sh] = s.split(':'); return [m, sh.split(',').map(Number)]; });
for (const [m, shape] of models) for (const ep of (q.get('ep') || 'webgpu').split(',')) {
  try {
    const s = await ort.InferenceSession.create(m, { executionProviders: [ep], graphOptimizationLevel: 'all', enableProfiling: q.has('prof') });
    if (q.has('prof')) ort.env.webgpu.profiling = { mode: 'default' };
    const x = new ort.Tensor('float32', new Float32Array(shape.reduce((a, b) => a * b)).map(() => Math.random()), shape);
    await s.run({ [s.inputNames[0]]: x });
    const t = performance.now(); for (let i = 0; i < 10; i++) await s.run({ [s.inputNames[0]]: x });
    log(`${m} ${ep} ${((performance.now() - t) / 10).toFixed(1)} ms`);
    if (q.has('prof')) s.endProfiling();
  } catch (e) { log(`${m} ${ep} ERR ${e.message}`); }
}
log('done');
</script>
